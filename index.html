<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Primeiro Projeto Web</title>
    <style>
        /* --- ESTILOS VISUAIS (CSS) --- */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            transition: background 0.5s ease;
        }

        .card {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 400px;
        }

        h1 {
            color: #38bdf8;
            margin-bottom: 10px;
            transition: color 0.5s ease;
        }

        p {
            color: #94a3b8;
            margin-bottom: 20px;
        }

        button {
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.5s;
        }

        button:hover {
            background-color: #0ea5e9;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <!-- --- ESTRUTURA DA PÁGINA (HTML) --- -->
    <div class="card">
        <h1 id="titulo">Olá, Mundo!</h1>
        <p id="mensagem">Esta é a minha primeira página web interativa do zero.</p>
        <button id="botaoInterativo">Clique Aqui</button>
    </div>

    <!-- --- INTERAÇÃO DINÂMICA (JAVASCRIPT) --- -->
    <script>
        const botao = document.getElementById('botaoInterativo');
        const titulo = document.getElementById('titulo');
        const mensagem = document.getElementById('mensagem');
        const corpoPagina = document.body;

        let estadoAlternado = false;

        botao.addEventListener('click', () => {
            if (!estadoAlternado) {
                corpoPagina.style.backgroundColor = "#064e3b"; // Fundo Verde
                titulo.innerText = "Interação Concluída!";
                titulo.style.color = "#34d399"; 
                mensagem.innerText = "O JavaScript alterou o texto, as cores e o fundo com sucesso!";
                botao.innerText = "Voltar ao Início";
                botao.style.backgroundColor = "#34d399";
                estadoAlternado = true;
            } else {
                corpoPagina.style.backgroundColor = "#0f172a"; // Fundo Azul Original
                titulo.innerText = "Olá, Mundo!";
                titulo.style.color = "#38bdf8";
                mensagem.innerText = "Esta é a minha primeira página web interativa do zero.";
                botao.innerText = "Clique Aqui";
                botao.style.backgroundColor = "#38bdf8";
                estadoAlternado = false;
            }
        });
    </script>
</body>
</html>
